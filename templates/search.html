{% extends "base.html" %}
{% block title %}Search{% endblock %}
{% block content %}
    <h1>Search Manga</h1>
    <form class="search-form" id="searchForm">
        <select name="source" id="sourceSelect">
            {% for addon in addons %}
                <option value="{{ addon }}" {% if addon == selected %}selected{% endif %}>{{ addon }}</option>
            {% endfor %}
        </select>
        <input type="text" name="q" id="searchQuery" placeholder="Enter title..." required>
        <button type="submit">Search</button>
    </form>
    <div id="results" class="results-grid"></div>
{% endblock %}

{% block scripts %}
    <script src="{{ url_for('static', filename='js/search.js') }}"></script>
{% endblock %}
